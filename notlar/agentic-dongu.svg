<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img">
<title>Agentic dongude gelen ve giden akislar</title>
<style>
  .bg    { fill: #ffffff; }
  .t     { font-family: system-ui, sans-serif; font-size: 14px; font-weight: 400; fill: #1a1a1a; }
  .th    { font-family: system-ui, sans-serif; font-size: 14px; font-weight: 500; fill: #1a1a1a; }
  .ts    { font-family: system-ui, sans-serif; font-size: 12px; font-weight: 400; fill: #5c5c5c; }
  .gray  { fill: #f0f0ef; stroke: #b8b8b5; }
  .blue  { fill: #e6f1fb; stroke: #85b7eb; }
  .amber { fill: #fdf1e0; stroke: #eab873; }
  .dash  { fill: none; stroke: #b8b8b5; stroke-dasharray: 3 3; }
  .arr   { stroke: #7a7a78; fill: none; }
  @media (prefers-color-scheme: dark) {
    .bg    { fill: #1f1f1e; }
    .t, .th { fill: #f0f0ef; }
    .ts    { fill: #a8a8a5; }
    .gray  { fill: #2e2e2c; stroke: #5c5c5a; }
    .blue  { fill: #0c2740; stroke: #2e6ba8; }
    .amber { fill: #3a2a12; stroke: #a07533; }
    .dash  { stroke: #5c5c5a; }
    .arr   { stroke: #909090; }
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect class="bg" x="0" y="0" width="680" height="420"/>

<rect class="gray" x="40" y="40" width="130" height="44" rx="4" stroke-width="0.5"/>
<text class="th" x="52" y="60">kullanici</text>
<text class="ts" x="52" y="76">mesaj gonderir</text>

<line class="arr" x1="105" y1="84" x2="105" y2="110" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect class="blue" x="40" y="112" width="600" height="56" rx="4" stroke-width="0.5"/>
<text class="th" x="52" y="136">harness (claude code)</text>
<text class="ts" x="52" y="154">baglami tutar, modeli her turda yeniden calistirir, bekleyen taraf burasidir</text>

<line class="arr" x1="105" y1="168" x2="105" y2="210" stroke-width="0.5" marker-end="url(#arrow)"/>
<line class="arr" x1="145" y1="210" x2="145" y2="168" stroke-width="0.5" marker-end="url(#arrow)"/>
<line class="arr" x1="415" y1="168" x2="415" y2="210" stroke-width="0.5" marker-end="url(#arrow)"/>
<line class="arr" x1="455" y1="210" x2="455" y2="168" stroke-width="0.5" marker-end="url(#arrow)"/>

<line class="arr" x1="202" y1="168" x2="202" y2="318" stroke-width="0.5" marker-end="url(#arrow)"/>
<line class="arr" x1="357" y1="318" x2="357" y2="168" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect class="amber" x="60" y="212" width="130" height="60" rx="4" stroke-width="0.5"/>
<text class="th" x="72" y="232">tur 1</text>
<text class="ts" x="72" y="248">baglami okur</text>
<text class="ts" x="72" y="264">arac ister</text>

<rect class="dash" x="215" y="212" width="130" height="60" rx="4" stroke-width="0.5"/>
<text class="ts" x="245" y="248">model yok</text>

<rect class="amber" x="370" y="212" width="130" height="60" rx="4" stroke-width="0.5"/>
<text class="th" x="382" y="232">tur 2</text>
<text class="ts" x="382" y="248">yeniden okur</text>
<text class="ts" x="382" y="264">cevap yazar</text>

<rect class="dash" x="520" y="212" width="110" height="60" rx="4" stroke-width="0.5"/>
<text class="ts" x="545" y="248">dongu surer</text>

<rect class="gray" x="215" y="320" width="130" height="52" rx="4" stroke-width="0.5"/>
<text class="th" x="227" y="342">arac calisir</text>
<text class="ts" x="227" y="358">zaman gecer</text>

<line class="arr" x1="48" y1="384" x2="48" y2="400" stroke-width="0.5" marker-end="url(#arrow)"/>
<text class="ts" x="58" y="397">asagi: baglam ve komut gider</text>
<line class="arr" x1="268" y1="400" x2="268" y2="384" stroke-width="0.5" marker-end="url(#arrow)"/>
<text class="ts" x="278" y="397">yukari: uretilen metin ve cikti doner</text>
</svg>
